AtUser:
  ## Per-country text. The script picks the 'country' or 'region' variant based on
  ## which World Bank loss series was used, then substitutes these placeholders:
  ## area, iso3, mix_year, loss, loss_year, region_name, region_code
  templates:
    country:
      description: >
          At grid generation mix for {area} ({iso3}), year {mix_year}, with added
          transmission and distribution (T&D) loss as reported by the World Bank
          ({loss:.4f} for this country) for {loss_year}.
      geography_description: >
          End use in {area}. T&D loss factor is for this country ({iso3}).
      time_description: &at_user_time >
          Process year follows World Bank T&D loss year {loss_year}.
          Upstream at grid mix year is {mix_year}.
      use_advice: >
          Use for end-use electricity demand in {area}.
          Low voltage reference is a U.S. 120 V proxy.
    region:
      description: >
          At grid generation mix for {area} ({iso3}), year {mix_year}, with added
          transmission and distribution (T&D) loss as reported by the World Bank
          ({loss:.4f}) for geographic region {region_name} ({region_code}) used
          as fallback due to lack of country specific data for {loss_year}.
      geography_description: >
          End use in {area}. T&D loss factor is for World Bank region
          {region_name} ({region_code}), not {area} specifically.
      time_description: *at_user_time
      use_advice: >
          Use for end-use electricity demand in {area}.
          Low voltage reference is a U.S. 120 V proxy.
          Loss factor is regional.

  technology_description: >
      Applies T&D loss to the country at grid generation mix. No additional
      generation technology mapping.

  inventory_method_description: >
      Attributional LCI method

  modeling_constants_description: >
      L is the World Bank indicator 'Electric power transmission and distribution
      losses (% of output)' (EG.ELC.LOSS.ZS), expressed as a fraction of output.
      Amount on the high voltage input is 1 / (1 - L).

  completeness_description: >
      No elementary flows. Completeness of the generation mix is that of the
      upstream at grid process; this process only adds T&D losses.

  data_selection_description: >
      Latest T&D loss year less than or equal to the
      linked at grid mix year. Geographic region fallback if no country series;
      omit if neither is available.

  data_treatment_description: >
      Static T&D loss factor applied.

  sampling_description: >
      No uncertainty was assessed.

  data_collection_description: >
      The World Bank indicator 'Electric power transmission and distribution
      losses (% of output)' (EG.ELC.LOSS.ZS), from the World Development
      Indicators, was accessed on August 7 2026.

  sources:
   - world_bank_eg_elc_loss_zs: World Bank electric power transmission and distribution losses


  project_description: *project_description

  intended_application: >
      End-use (at user) electricity demand in the country, linked to the U.S.
      Electricity Baseline via the country at grid mix.
      The background electricity processes incorporate a range of flows that are
      characterized in several impact categories.

  data_generator:
      USLCI: 'ERG'

  data_documentor:
      USLCI: 'ERG'

  publication:
      flcac_international_electricity: 'ERG, International Electricity'

  reviews:
    1:
      reviewType: 'Dependent internal review'
      reviewers:
        - USLCI: 'ERG'
      details: >
        Internal review of methods and metadata.

  restrictions_description: >
      The underlying World Bank indicator 'Electric power transmission and
      distribution losses (% of output)' (EG.ELC.LOSS.ZS; IEA Statistics via
      World Bank, World Development Indicators) is released under a Creative
      Commons Attribution 4.0 International Licence (CC BY 4.0).

      These U.S. LCI Database Project data ("Data") are provided by the National Laboratory of the Rockies ("NLR"), operated by the Alliance for Sustainable Energy, LLC ("Alliance") for the US Department of Energy ("DOE") under Contract No. DE-AC36-08GO28308. The United States Government (the "Government") retains and the user acknowledges that the Government retains a non-exclusive, paid-up, irrevocable, worldwide license to publish or reproduce the published form of these data, or allow others to do so, for Government purposes.

