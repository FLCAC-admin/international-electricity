UsAverage:
  description: >
      US-average resource process represented as a balancing-authority provider
      mix. Each input exchange links to a BA resource process and uses a
      normalized weight back-calculated from the process
      'Electricity; at grid; consumption mix - US - US'.

  time_description: >
      This process represents the grid mix of the year modeled in the U.S.
      Electricity Baseline.

  geography_description: >
      This process represents a US-average mix of balancing-authority resource
      processes for one fuel.

  technology_description: >
      Technosphere mixer only: weighted providers of balancing-authority
      resource processes. No elementary flows.

  inventory_method_description: >
      Not applicable; this process contains only technosphere flows.

  modeling_constants_description: >
      Provider weights are contribution = US_BA_weight × BA_resource_fraction,
      normalized within the resource so BA providers sum to 1.

  completeness_description: >
      This process contains no elementary flows. Provider weights sum to 1.

  data_selection_description: >
      Balancing-authority resource shares are taken from the US Electricity
      Baseline process 'Electricity; at grid; consumption mix - US - US'.

  data_treatment_description: >
      BA contributions are normalized within each resource to form a US-average
      provider mix.

  sampling_description: >
      No uncertainty was assessed.

  data_collection_description: >
      Not applicable.

  use_advice: >
      Use as an estimated US-average fuel-resource provider where regional data
      are unknown. Emissions and other elementary flows come from the linked
      balancing-authority resource processes, not from this mixer.

  project_description: *project_description

  intended_application: >
      US-average fuel-resource mixer for use with the U.S. Electricity Baseline.

  data_generator:
      USLCI: 'ERG'

  data_documentor:
      USLCI: 'ERG'

  publication:
      flcac_international_electricity: 'ERG, International Electricity'

  restrictions_description: >
      These U.S. LCI Database Project data ("Data") are provided by the National Labratory of the Rockies ("NLR"), operated by the Alliance for Sustainable Energy, LLC ("Alliance") for the US Department of Energy ("DOE") under Contract No. DE-AC36-08GO28308. The United States Government (the "Government") retains and the user acknowledges that the Government retains a non-exclusive, paid-up, irrevocable, worldwide license to publish or reproduce the published form of these data, or allow others to do so, for Government purposes.

