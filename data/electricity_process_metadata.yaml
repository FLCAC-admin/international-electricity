## At-grid, at-user, and US-average mixers are independent.
## Script loads AtGrid / AtUser / UsAverage separately; do not share scientific metadata.

AtGrid:
  description: >
      Electricity generation mixes by country, as sourced from Ember Climate, are
      linked to U.S. based generators and supply chains. These data represent a
      generation mix and do not account for transmission loss to end users.

  time_description: >
      This process reflects the generation mix of the region over the course of
      the entire year. It reflects the most recently available full year.

  geography_description: >
      This process represents the generation mix of the entire region.

  technology_description: >
      Generation technologies were mapped to those available in the U.S.
      Electricity Baseline.

  inventory_method_description: >
      Not applicable; this process contains only technosphere flows.

  modeling_constants_description: >
      Approaches to compile and estimate generation mixes for specific countries
      by Ember Climate are described in the linked Ember Climate Data Methodology
      source object.

  completeness_description: >
      This process contains no elementary flows. Generation mix of all technologies
      sums to 100%.

  data_selection_description: >
      Data were retrieved for all available countries for the most recent data year.

  data_treatment_description: >
      Generation by fuel subcategory were normalized to total generation for each
      country to generate resource shares.

  sampling_description: >
      No uncertainty was assessed.

  data_collection_description: >
      Data from Ember Climate were accessed on August 7 2026.

  use_advice: >
      This process is intended to connect to electricity generation processes from
      the electricity baseline. It does not include transmission and distribution
      losses to end users; use the corresponding at-user process for that.

  sources:
   - ember_climate_yearly_2025: Ember Climate Yearly Electricity Data
   - ember_climate_data_2022: Ember Climate Data Methodology

  project_description: >
      This dataset was developed by the Federal LCA Commons Data Curator Eastern
      Research Group, Inc. (ERG) under subcontract (SUB-2024-10066) to the National
      Renewable Energy Laboratory under Department of Energy (DOE) Prime Contract
      No. DE-AC36-08GO28308. The work is funded by DOE's Advanced Materials &
      Manufacturing Technologies Office (AMMTO).

  intended_application: >
      This process is intended for use with electricity flows from the U.S.
      Electricity Baseline as a country generation mix (at grid).

  data_generator:
      USLCI: 'ERG'

  data_documentor:
      USLCI: 'ERG'

  publication:
      flcac_international_electricity: 'ERG, International Electricity'

  reviews:
    1:
      reviewType: 'Dependent internal review'
      reviewers:
        - USLCI: 'ERG'
      details: >
        details of review performed go here

  restrictions_description: >
      The underlying Ember Climate data is released under a Creative Commons Attribution Licence.

      These U.S. LCI Database Project data ("Data") are provided by the National Renewable Energy Laboratory ("NREL"), operated by the Alliance for Sustainable Energy, LLC ("Alliance") for the US Department of Energy ("DOE") under Contract No. DE-AC36-08GO28308. The United States Government (the "Government") retains and the user acknowledges that the Government retains a non-exclusive, paid-up, irrevocable, worldwide license to publish or reproduce the published form of these data, or allow others to do so, for Government purposes.

