AtUser:
  # description, geography_description, time_description, use_advice:
  # filled per country in international_electricity_mixes_olca.py

  technology_description: >
      Single T&D gross-up of the country at-grid generation mix. No additional
      generation technology mapping. LV reference is a U.S. 120 V proxy, not
      country-native low voltage.

  inventory_method_description: >
      Technosphere only: 1 MJ LV out; HV in from the country at-grid process at
      1 / (1 - L).

  modeling_constants_description: >
      L is EG.ELC.LOSS.ZS as a fraction of output. Amount on the HV input is
      1 / (1 - L). Missing country series use the World Bank geographic region; otherwise
      the at-user process is omitted.

  completeness_description: >
      No elementary flows. Completeness of the generation mix is that of the
      upstream at-grid process; this process only adds T&D losses.

  data_selection_description: >
      Latest EG.ELC.LOSS.ZS year less than or equal to the linked at-grid mix year.
      Geographic region fallback if no country series; omit if neither is available.

  data_treatment_description: >
      Static loss factor applied as a gross-up. L = 0 is kept (amount = 1).
      L >= 1 is rejected.

  sampling_description: >
      No uncertainty was assessed.

  data_collection_description: >
      World Bank EG.ELC.LOSS.ZS was accessed on August 7 2026.

  sources:
   - world_bank_eg_elc_loss_zs: World Bank electric power transmission and distribution losses


  project_description: >
      This dataset was developed by the Federal LCA Commons Data Curator Eastern
      Research Group, Inc. (ERG) under subcontract (SUB-2024-10066) to the National
      Renewable Energy Laboratory under Department of Energy (DOE) Prime Contract
      No. DE-AC36-08GO28308. The work is funded by DOE's Advanced Materials &
      Manufacturing Technologies Office (AMMTO).

  intended_application: >
      End-use (at user) electricity demand in the country, linked to the U.S.
      Electricity Baseline via the country at-grid mix and a U.S. 120 V LV proxy.

  data_generator:
      USLCI: 'ERG'

  data_documentor:
      USLCI: 'ERG'

  publication:
      flcac_international_electricity: 'ERG, International Electricity'

  reviews:
    1:
      reviewType: 'Dependent internal review'
      reviewers:
        - USLCI: 'ERG'
      details: >
        details of review performed go here

  restrictions_description: >
      The underlying World Bank indicator EG.ELC.LOSS.ZS (IEA Statistics via
      World Bank, World Development Indicators) is released under a Creative
      Commons Attribution 4.0 International Licence (CC BY 4.0).

      These U.S. LCI Database Project data ("Data") are provided by the National Renewable Energy Laboratory ("NREL"), operated by the Alliance for Sustainable Energy, LLC ("Alliance") for the US Department of Energy ("DOE") under Contract No. DE-AC36-08GO28308. The United States Government (the "Government") retains and the user acknowledges that the Government retains a non-exclusive, paid-up, irrevocable, worldwide license to publish or reproduce the published form of these data, or allow others to do so, for Government purposes.

